<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Enter your marks and get your percentage, grade and result instantly." />
  <title>Marks Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- Shared gradients for the ring and logo -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2563EB" />
        <stop offset="1" stop-color="#7C3AED" />
      </linearGradient>
      <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2563EB" />
        <stop offset="1" stop-color="#7C3AED" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">

    <!-- Header -->
    <header class="site-header">
      <a class="brand" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 2.5 8.2 12 13l9.5-4.8z" />
          <path d="M6.5 10.9v4.3c0 1.6 2.5 2.9 5.5 2.9s5.5-1.3 5.5-2.9v-4.3L12 13.8z" />
        </svg>
        <span>Marks Calculator</span>
      </a>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </header>

    <main>

      <!-- SECTION 1: Enter marks -->
      <section class="card input-section" aria-labelledby="input-title">
        <h1 id="input-title">Enter your marks</h1>
        <p class="subtitle">Type your marks and find out instantly if you passed.</p>

        <form id="calculator-form" novalidate>
          <div class="field">
            <label for="obtained-marks">Your marks</label>
            <input
              id="obtained-marks"
              type="number"
              placeholder="e.g. 850"
              min="0"
              step="any"
              inputmode="decimal"
              aria-describedby="obtained-error"
            />
            <p class="error-msg" id="obtained-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="total-marks">Total marks</label>
            <input
              id="total-marks"
              type="number"
              placeholder="e.g. 1000"
              min="1"
              step="any"
              inputmode="decimal"
              aria-describedby="total-error"
            />
            <p class="error-msg" id="total-error" aria-live="polite"></p>
          </div>

          <button class="btn btn-primary" type="submit">Show result</button>
          <button class="btn btn-link" id="reset-btn" type="button">Reset</button>
        </form>
      </section>

      <!-- SECTION 2: Result -->
      <section class="card result-section" id="result-section" aria-labelledby="result-title" hidden>
        <h2 id="result-title">Your result</h2>

        <div class="result-layout">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
              <circle class="ring-track" cx="80" cy="80" r="68" />
              <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="68" />
            </svg>
            <div class="ring-value">
              <span class="percentage"><span id="percentage-value">0</span>%</span>
              <span class="ring-label">Percentage</span>
            </div>
          </div>

          <div class="result-details">
            <div class="detail">
              <span class="detail-label">Grade</span>
              <span class="grade" id="grade-output">–</span>
            </div>

            <div class="detail">
              <span class="detail-label">Marks</span>
              <span class="marks" id="marks-output">0 / 0</span>
            </div>

            <div class="detail">
              <span class="detail-label">Status</span>
              <span class="status" id="status-output">–</span>
            </div>

            <p class="message" id="message-output"></p>
          </div>
        </div>
      </section>

    </main>
  </div>

</body>
</html>
